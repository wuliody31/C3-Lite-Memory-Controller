[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c3-memory-orchestration"
version = "0.1.0"
description = "Lifecycle-aware multi-memory orchestration for long-term LLM agents"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "neo4j>=5.20",
    "python-dateutil>=2.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "experiments",
    "outputs",
    "artifacts",
    "vendor",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 0
